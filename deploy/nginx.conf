server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite genera nombres con hash en /assets, se pueden cachear sin miedo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # react-router: cualquier ruta del cliente cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
