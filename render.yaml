# Blueprint de Render: API en el plan gratis (Docker). Ver "Despliegue sin VPS" en DEPLOY.md.
# Los secretos (sync: false) se piden en el panel al crear el Blueprint; no se versionan.
services:
  - type: web
    name: student-manager-api
    runtime: docker
    plan: free
    # Elige la región más cercana a la de tu proyecto en Neon (oregon, ohio, virginia, frankfurt, singapore).
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Dominio del frontend, p. ej. https://student-manager.pages.dev (varios: separados por coma).
      - key: CORS_ORIGIN
        sync: false
      # Neon: connection string DIRECTA (host sin "-pooler"), con sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
