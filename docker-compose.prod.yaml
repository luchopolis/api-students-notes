# Producción en un VPS: frontend (nginx) + API. La base de datos es Neon y los archivos van a un bucket S3 externo (Cloudflare R2).
# MinIO es opcional: `docker compose --profile minio up -d` (ver DEPLOY.md). Variables en `.env` (ver .env.production.example).

services:
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST:-./frontend-dist}:/usr/share/nginx/html:ro

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL (connection string de Neon)}
      CORS_ORIGIN: http://${PUBLIC_HOST:?Falta PUBLIC_HOST (IP del droplet)}
      S3_BUCKET: ${S3_BUCKET:?Falta S3_BUCKET}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: "${S3_ENDPOINT:?Falta S3_ENDPOINT (R2: https://ACCOUNT_ID.r2.cloudflarestorage.com)}"
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Falta S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Falta S3_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET (openssl rand -base64 48)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

  # Opcional (profile `minio`): almacén propio en vez de R2. Con esto, S3_ENDPOINT debe ser http://IP_PUBLICA:9000 (la URL de descarga la abre el navegador),
  # S3_FORCE_PATH_STYLE=true y S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY iguales a MINIO_ROOT_USER/MINIO_ROOT_PASSWORD.
  # Ojo: la imagen de quay.io es de octubre de 2025 y ya no recibe actualizaciones.
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # API S3 (el navegador descarga por aquí)
      - "127.0.0.1:9001:9001" # consola web: solo por túnel SSH
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
      start_period: 10s

  # Un solo uso: crea el bucket si no existe y termina.
  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-student-manager-files}

  # Aplica el esquema en Neon y crea/actualiza el usuario principal (ADMIN_*): `docker compose run --rm migrate`. No arranca con `up`.
  migrate:
    build:
      context: .
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_NAME: ${ADMIN_NAME:-Profesora}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL (usuario principal)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD (usuario principal)}
    command: ["sh", "-c", "npx prisma db update --no-interactive && node dist/prisma/seed-admin.js"]

volumes:
  minio_data:
